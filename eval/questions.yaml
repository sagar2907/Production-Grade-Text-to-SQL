# The gold evaluation set.
#
# ============================================================================
#  REVIEW THIS FILE BEFORE QUOTING ANY NUMBER FROM THIS PROJECT.
#
#  Every judgement call here -- which reading of an ambiguous question counts
#  as certified, which questions are refusals rather than answers -- determines
#  every metric the project reports. These 16 ambiguous + 12 unanswerable
#  categorizations have NOT been reviewed by a human. See
#  eval/gold_audit_report.md section 2 for a structural note on the ambiguous
#  set (six of the sixteen test the same underlying ambiguity restated).
#
#  The 32 gold_sql queries (answerable + trap) are more load-bearing: run
#  `python scripts/audit_gold.py` for details. 32/32 independently verified
#  against a different join path, an algebraic identity, or a known generation
#  invariant -- not a second opinion in the same reasoning context, which is
#  a materially weaker check. Full diagnostic trail in gold_audit_report.md.
#  That audit does NOT touch the categorization judgement calls above; only a
#  human review can.
# ============================================================================
#
# Categories:
#   answerable    exactly one certified reading -> the system should answer
#   trap          answerable, but with a tempting wrong path that runs cleanly
#   ambiguous     more than one certified reading -> the system should REFUSE
#   unanswerable  no data exists -> the system should REFUSE, not return zero
#
# `expect` is what a correct system does. For answerable and trap questions
# that is `answer` plus matching gold_sql; for the rest it is `refuse`.

version: 1
updated: 2026-08-26
database: data/rosetta.duckdb

questions:

# ---------------------------------------------------------------------------
# ANSWERABLE -- one certified reading
# ---------------------------------------------------------------------------
- id: Q01
  category: answerable
  expect: answer
  question: What was the Budget Estimate for the Ministry of Railways in 2019-20?
  gold_sql: |
    SELECT SUM(a.be_amount_crore)
    FROM budget_allocations a JOIN ministries m ON a.ministry_id = m.ministry_id
    WHERE a.fiscal_year = '2019-20' AND m.ministry_name = 'Ministry of Railways'

- id: Q02
