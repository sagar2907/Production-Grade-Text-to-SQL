# ---------------------------------------------------------------------------
# TRAP -- answerable, but a tempting wrong path runs cleanly
# ---------------------------------------------------------------------------
- id: T01
  category: trap
  trap: units
  expect: answer
  question: What was the total Budget Estimate across all spending in 2023-24, in crore?
  gold_sql: |
    SELECT SUM(be_amount_crore) FROM budget_allocations WHERE fiscal_year = '2023-24'
  wrong_path: SUM(be_amount_lakh) -- runs cleanly, returns exactly 100x

- id: T02
  category: trap
  trap: units
  expect: answer
  question: Give the Budget Estimate for the Ministry of Railways in 2018-19 in rupees crore.
  gold_sql: |
    SELECT SUM(a.be_amount_crore)
    FROM budget_allocations a JOIN ministries m ON a.ministry_id = m.ministry_id
    WHERE a.fiscal_year = '2018-19' AND m.ministry_name = 'Ministry of Railways'
  wrong_path: be_amount_rupees -- 10,000,000x out

- id: T03
  category: trap
  trap: plan_era
  expect: answer
  question: What was Plan expenditure in 2016-17?
  gold_sql: |
    SELECT SUM(plan_amount_crore) FROM budget_allocations WHERE fiscal_year = '2016-17'
  wrong_path: none for this year -- the trap is the adjacent question U01

- id: T04
  category: trap
  trap: fan_out
  expect: answer
  question: For 2019-20, give each ministry's Budget Estimate alongside its total actual expenditure from the monthly table.
  gold_sql: |
    WITH monthly AS (
      SELECT fiscal_year, ministry_id, SUM(expenditure_crore) AS actual_crore
      FROM expenditure_actuals WHERE fiscal_year = '2019-20'
      GROUP BY 1, 2
    )
    SELECT m.ministry_name,
           SUM(a.be_amount_crore) AS be_crore,
           MAX(mo.actual_crore)   AS actual_crore
    FROM budget_allocations a
    JOIN ministries m ON a.ministry_id = m.ministry_id
    LEFT JOIN monthly mo ON mo.ministry_id = a.ministry_id
                        AND mo.fiscal_year = a.fiscal_year
    WHERE a.fiscal_year = '2019-20'
    GROUP BY 1 ORDER BY 2 DESC
  wrong_path: direct join to expenditure_actuals -- inflates the BE column ~42x

- id: T05
  category: trap
  trap: entity_scope
  expect: answer
  question: What did administrative ministries and departments spend in 2022-23 on a Budget Estimate basis, excluding functional lines?
  gold_sql: |
    SELECT SUM(a.be_amount_crore)
    FROM budget_allocations a JOIN ministries m ON a.ministry_id = m.ministry_id
    WHERE a.fiscal_year = '2022-23' AND m.entity_kind IN ('ministry','department')
  wrong_path: no entity_kind filter -- includes Interest Payments etc, ~1.8x larger

- id: T06
  category: trap
  trap: rename
  expect: answer
  question: Give the Budget Estimate for education spending in each year from 2014-15 to 2022-23, following the Ministry of Human Resource Development through its rename to the Department of School Education and Literacy.
  gold_sql: |
    SELECT a.fiscal_year, SUM(a.be_amount_crore) AS total_crore
    FROM budget_allocations a JOIN ministries m ON a.ministry_id = m.ministry_id
    WHERE m.ministry_name IN (
        'Ministry of Human Resource Development',
        'Department of School Education and Literacy')
    GROUP BY 1 ORDER BY 1
  wrong_path: filtering one name only -- series stops dead at the rename

- id: T07
  category: trap
  trap: gross_net
  expect: answer
  question: What was the gross Budget Estimate in 2020-21, before recoveries?
  gold_sql: |
    SELECT SUM(gross_amount_crore) FROM budget_allocations WHERE fiscal_year = '2020-21'
  wrong_path: net_amount_crore -- up to 6% lower

- id: T08
  category: trap
  trap: borrowings
  expect: answer
  question: What were revenue receipts, excluding borrowings, on a Budget Estimate basis in 2021-22?
  gold_sql: |
    SELECT SUM(be_amount_crore) FROM receipts
    WHERE fiscal_year = '2021-22' AND is_revenue_receipt = TRUE
  wrong_path: summing all receipts -- includes borrowings, roughly doubles it

- id: T09
  category: trap
  trap: devolution
  expect: answer
  question: How much tax revenue was actually available to the centre in 2020-21 after devolution to states?
  gold_sql: |
    SELECT SUM(net_to_centre_crore) FROM receipts
    WHERE fiscal_year = '2020-21' AND receipt_type = 'tax'
  wrong_path: gross_amount_crore -- ~41% too high

- id: T10
  category: trap
  trap: null_join
  expect: answer
  question: What is the total Budget Estimate for 2021-22 counting all allocations, including those not tied to any state?
  gold_sql: |
    SELECT SUM(be_amount_crore) FROM budget_allocations WHERE fiscal_year = '2021-22'
  wrong_path: INNER JOIN to states -- silently drops ~72% of rows where state_code IS NULL

- id: T11
  category: trap
  trap: scheme_merge
  expect: answer
  question: What was the Budget Estimate for Sarva Shiksha Abhiyan in 2016-17?
  gold_sql: |
    SELECT SUM(a.be_amount_crore)
    FROM budget_allocations a JOIN schemes s ON a.scheme_id = s.scheme_id
    WHERE a.fiscal_year = '2016-17' AND s.scheme_name = 'Sarva Shiksha Abhiyan'
  wrong_path: including Samagra Shiksha, which did not exist until 2018-19

- id: T12
  category: trap
  trap: estimate_basis
  expect: answer
  question: Compare Budget Estimate against Revised Estimate for the Ministry of Railways in 2019-20.
  gold_sql: |
    SELECT SUM(a.be_amount_crore) AS be_crore, SUM(a.re_amount_crore) AS re_crore
    FROM budget_allocations a JOIN ministries m ON a.ministry_id = m.ministry_id
    WHERE a.fiscal_year = '2019-20' AND m.ministry_name = 'Ministry of Railways'

